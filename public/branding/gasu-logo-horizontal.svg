<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 82" width="100%" height="100%" fill="none">
  <!-- GASU SISTEMAS INDUSTRIALES - LOGOTIPO OFICIAL VECTORIAL -->
  <g id="isotipo" transform="translate(4, 5)">
    <!-- Cuadrante 1: Robótica (Gris industrial) -->
    <rect x="0" y="0" width="34" height="34" rx="6" fill="#606166" />
    <g transform="translate(0, 0)">
      <rect x="7" y="27" width="14" height="2.5" rx="1" fill="#FFFFFF" />
      <ellipse cx="14" cy="25" rx="4.5" ry="2.5" fill="#FFFFFF" />
      <circle cx="14" cy="23" r="2.8" fill="#FFFFFF" />
      <path d="M 13 22 L 20 12 L 22.5 13.8 L 15.5 23.8 Z" fill="#FFFFFF" />
      <circle cx="21" cy="13" r="2.6" fill="#FFFFFF" />
      <line x1="14" y1="19" x2="19" y2="15" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 21 12 L 28 12 L 28 14.2 L 21 14.2 Z" fill="#FFFFFF" />
      <circle cx="28" cy="13.1" r="1.5" fill="#FFFFFF" />
      <path d="M 29.5 11 L 31.5 11 L 31.5 15.2 L 29.5 15.2 Z" fill="#FFFFFF" />
      <path d="M 31.5 10.2 L 33 10.2 L 33 12 M 31.5 16 L 33 16 L 33 14.2" stroke="#FFFFFF" stroke-width="1" fill="none" />
    </g>

    <!-- Cuadrante 2: Engranaje (Azul GASU) -->
    <rect x="38" y="0" width="34" height="34" rx="6" fill="#003A70" />
    <g transform="translate(55, 17)">
      <rect x="-2.2" y="-12" width="4.4" height="24" rx="1" fill="#FFFFFF" />
      <rect x="-2.2" y="-12" width="4.4" height="24" rx="1" transform="rotate(45)" fill="#FFFFFF" />
      <rect x="-2.2" y="-12" width="4.4" height="24" rx="1" transform="rotate(90)" fill="#FFFFFF" />
      <rect x="-2.2" y="-12" width="4.4" height="24" rx="1" transform="rotate(135)" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="9.2" fill="#FFFFFF" />
      <circle cx="0" cy="0" r="4.6" fill="#003A70" />
      <rect x="-1" y="-5.2" width="2" height="2.5" fill="#003A70" />
    </g>

    <!-- Cuadrante 3: Circuitos PCB (Azul GASU) -->
    <rect x="0" y="38" width="34" height="34" rx="6" fill="#003A70" />
    <g stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 5 46 L 14 46 L 19 50 L 25 50" />
      <path d="M 5 55 L 22 55" />
      <path d="M 5 64 L 12 64 L 16 60 L 25 60" />
      <circle cx="25" cy="50" r="1.8" fill="#FFFFFF" stroke="none" />
      <circle cx="22" cy="55" r="1.8" fill="#FFFFFF" stroke="none" />
      <circle cx="25" cy="60" r="1.8" fill="#FFFFFF" stroke="none" />
      <circle cx="5" cy="46" r="1.2" fill="#FFFFFF" stroke="none" />
      <circle cx="5" cy="55" r="1.2" fill="#FFFFFF" stroke="none" />
      <circle cx="5" cy="64" r="1.2" fill="#FFFFFF" stroke="none" />
    </g>

    <!-- Cuadrante 4: Energía / Rayo (Gris industrial) -->
    <rect x="38" y="38" width="34" height="34" rx="6" fill="#606166" />
    <polygon points="57,44 47,56 53,56 51,66 63,53 56.5,53" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round" />
  </g>

  <!-- Tipografía GASU -->
  <g id="logotipo-texto" transform="translate(88, 0)">
    <text x="0" y="47" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="45" font-weight="800" letter-spacing="-0.025em">
      <tspan fill="#003A70">G</tspan>
      <tspan fill="#4A5568" dx="-1">ASU</tspan>
    </text>
    <path d="M 68 50 L 142 50" stroke="#4A5568" stroke-width="4.5" stroke-linecap="round" opacity="0.9" />

    <g transform="translate(1, 64)">
      <text x="0" y="0" font-family="'Space Grotesk', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.22em" fill="#003A70">
        SISTEMAS INDUSTRIALES
      </text>
      <line x1="0" y1="5" x2="242" y2="5" stroke="#003A70" stroke-width="1.5" stroke-opacity="0.75" />
      <rect x="242" y="3.5" width="3" height="3" fill="#003A70" />
    </g>
  </g>
</svg>
